<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rotorua Pickleball Club Gear</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  html, body { margin: 0; padding: 0; background: #0A0C10; overflow-x: hidden; }
  #root { min-height: 100vh; display: flex; align-items: stretch; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo } = React;

/* ============ CONFIGURE THIS ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbxJ5B4Z2mZpeSjA9X28shThGRIT7FGw6xCIl4DOmCqfUNsD6ONkxUgQbcOa0cytdzbk6w/exec";
const API_TOKEN = ""; // only needed if you set a TOKEN script property in Apps Script
/* ========================================= */

const storage = {
  async get(key) {
    const url = `${API_URL}?key=${encodeURIComponent(key)}${API_TOKEN ? `&token=${encodeURIComponent(API_TOKEN)}` : ""}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || data.value === undefined || data.value === null) return null;
    return { key, value: JSON.stringify(data.value) };
  },
  async set(key, value) {
    const url = `${API_URL}${API_TOKEN ? `?token=${encodeURIComponent(API_TOKEN)}` : ""}`;
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key, value: JSON.parse(value) }),
    });
    return { key, value };
  },
};

const uid = () => Math.random().toString(36).slice(2, 10);
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
const now = () => new Date().toISOString();
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
const initials = (name) => (name || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const roleLabel = (role) => (role === "superadmin" ? "Super Admin" : role === "admin" ? "Admin" : "Staff");
const rolePillClass = (role) => (role === "superadmin" ? "status-superadmin" : role === "admin" ? "status-paid" : "status-unpaid");

const LOW_STOCK = 5;
const DEFAULT_SIZES = ["XS", "S", "M", "L", "XL", "XXL", "One Size"];
const DEFAULT_CATEGORIES = ["T-Shirt", "Hoodie", "Cap", "Water Bottle", "Bag", "Other"];

function normalizePresets(loaded) {
  const base = { categories: DEFAULT_CATEGORIES, names: [], generalSizes: DEFAULT_SIZES, sizesByCategory: {} };
  if (!loaded) return base;
  return {
    categories: loaded.categories || base.categories,
    names: loaded.names || base.names,
    generalSizes: loaded.generalSizes || loaded.sizes || base.generalSizes,
    sizesByCategory: loaded.sizesByCategory || {},
  };
}

function stockTone(qty) {
  if (qty <= 0) return { label: "Out of stock", cls: "tone-danger" };
  if (qty <= LOW_STOCK) return { label: "Low stock", cls: "tone-warn" };
  return { label: "In stock", cls: "tone-ok" };
}

/* ---------- minimal inline icon set (no external icon package needed) ---------- */
const Icon = ({ children, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Package = (p) => <Icon {...p}><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></Icon>;
const ShoppingCart = (p) => <Icon {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></Icon>;
const Truck = (p) => <Icon {...p}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M12 2 1 21h22L12 2z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-6.36L1 10"/></Icon>;
const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const UsersIcon = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
const Menu = (p) => <Icon {...p}><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></Icon>;
const Grid = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></Icon>;
const ListIcon = (p) => <Icon {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>;
const SettingsIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
const ClipboardList = (p) => <Icon {...p}><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="12" y2="19"/></Icon>;

function App() {
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [users, setUsers] = useState([]);
  const [presets, setPresets] = useState(normalizePresets(null));
  const [auditLog, setAuditLog] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("stock");
  const [toast, setToast] = useState(null);
  const [connError, setConnError] = useState(false);
  const [navOpen, setNavOpen] = useState(false);
  const [portalMode, setPortalMode] = useState(false);
  const [publicOrderMode, setPublicOrderMode] = useState(false);

  const [productModal, setProductModal] = useState(null);
  const [orderModal, setOrderModal] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteOrder, setConfirmDeleteOrder] = useState(null);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("order") === "1") setPublicOrderMode(true);
    if (params.get("track") === "1") setPortalMode(true);
    (async () => {
      try {
        const p = await storage.get("club-gear-products");
        const o = await storage.get("club-gear-orders");
        const u = await storage.get("club-gear-users");
        const pr = await storage.get("club-gear-presets");
        const log = await storage.get("club-gear-audit-log");
        setProducts(p ? JSON.parse(p.value) : []);
        setOrders(o ? JSON.parse(o.value) : []);
        setUsers(u ? JSON.parse(u.value) : []);
        setPresets(normalizePresets(pr ? JSON.parse(pr.value) : null));
        setAuditLog(log ? JSON.parse(log.value) : []);
        const sessionId = localStorage.getItem("clubgear-session");
        if (sessionId) {
          const loaded = u ? JSON.parse(u.value) : [];
          const match = loaded.find((usr) => usr.id === sessionId);
          if (match) setCurrentUser(match);
        }
      } catch (e) {
        console.error("Load failed", e);
        setConnError(true);
      }
      setReady(true);
    })();
  }, []);

  const saveProducts = async (next) => {
    setProducts(next);
    try { await storage.set("club-gear-products", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const saveOrders = async (next) => {
    setOrders(next);
    try { await storage.set("club-gear-orders", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const saveUsers = async (next) => {
    setUsers(next);
    try { await storage.set("club-gear-users", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const savePresets = async (next) => {
    setPresets(next);
    try { await storage.set("club-gear-presets", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const AUDIT_LOG_CAP = 1000;
  const logAction = (action, details) => {
    const entry = { id: uid(), at: now(), actor: currentUser?.name || "Customer (online form)", action, details };
    setAuditLog((prevLog) => {
      const next = [entry, ...prevLog].slice(0, AUDIT_LOG_CAP);
      storage.set("club-gear-audit-log", JSON.stringify(next)).catch((e) => console.error("Audit log save failed", e));
      return next;
    });
  };

  const showToast = (text, kind = "ok", undo = null) => {
    const id = uid();
    setToast({ text, kind, id, undo });
    setTimeout(() => setToast((t) => (t && t.id === id ? null : t)), undo ? 6000 : 3200);
  };

  const productMap = useMemo(() => Object.fromEntries(products.map((p) => [p.id, p])), [products]);
  const isAdmin = currentUser?.role === "admin" || currentUser?.role === "superadmin";
  const isSuperAdmin = currentUser?.role === "superadmin";
  const closeNav = () => setNavOpen(false);

  // ---------- Auth ----------
  const loginAs = (user) => { setCurrentUser(user); localStorage.setItem("clubgear-session", user.id); };
  const createAccount = async (name, role, pin) => {
    const trimmed = name.trim();
    if (!trimmed) return showToast("Enter a name", "danger");
    if (users.some((u) => u.name.toLowerCase() === trimmed.toLowerCase())) return showToast("That name's already taken", "danger");
    const account = { id: uid(), name: trimmed, role, pin: pin ? pin.trim() : "", createdAt: now() };
    await saveUsers([...users, account]);
    loginAs(account);
    showToast(`Welcome, ${trimmed}`);
  };
  const attemptLogin = (user, pinInput) => {
    if (user.pin && user.pin !== pinInput.trim()) return showToast("Wrong PIN", "danger");
    loginAs(user);
    showToast(`Welcome back, ${user.name}`);
  };
  const logout = () => { setCurrentUser(null); localStorage.removeItem("clubgear-session"); };
  const updateUserRole = (id, role) => {
    const superAdmins = users.filter((u) => u.role === "superadmin");
    if (role !== "superadmin" && superAdmins.length === 1 && superAdmins[0].id === id) return showToast("Need at least one super admin", "danger");
    const target = users.find((u) => u.id === id);
    saveUsers(users.map((u) => (u.id === id ? { ...u, role } : u)));
    if (currentUser?.id === id) setCurrentUser((c) => ({ ...c, role }));
    if (target) logAction("Role changed", `${target.name}: ${roleLabel(target.role)} → ${roleLabel(role)}`);
  };
  const removeUser = (id) => {
    const superAdmins = users.filter((u) => u.role === "superadmin");
    if (superAdmins.length === 1 && superAdmins[0].id === id) return showToast("Need at least one super admin", "danger");
    const target = users.find((u) => u.id === id);
    saveUsers(users.filter((u) => u.id !== id));
    if (currentUser?.id === id) logout();
    showToast("Teammate removed");
    if (target) logAction("Teammate removed", `${target.name} (${roleLabel(target.role)})`);
  };
  const addTeammate = (name, role, pin) => {
    const trimmed = name.trim();
    if (!trimmed) { showToast("Enter a name", "danger"); return false; }
    if (users.some((u) => u.name.toLowerCase() === trimmed.toLowerCase())) { showToast("That name's already taken", "danger"); return false; }
    const account = { id: uid(), name: trimmed, role, pin: pin ? pin.trim() : "", createdAt: now() };
    saveUsers([...users, account]);
    showToast(`Account created for ${trimmed}`);
    logAction("Account created", `${trimmed} (${roleLabel(role)})`);
    return true;
  };

  // ---------- Presets ----------
  const addCategory = (value) => {
    const v = value.trim();
    if (!v) return;
    if (presets.categories.some((x) => x.toLowerCase() === v.toLowerCase())) return showToast("Already on the list", "danger");
    savePresets({ ...presets, categories: [...presets.categories, v] });
  };
  const removeCategory = (value) => savePresets({ ...presets, categories: presets.categories.filter((x) => x !== value) });
  const addName = (value) => {
    const v = value.trim();
    if (!v) return;
    if (presets.names.some((x) => x.toLowerCase() === v.toLowerCase())) return showToast("Already on the list", "danger");
    savePresets({ ...presets, names: [...presets.names, v] });
  };
  const removeName = (value) => savePresets({ ...presets, names: presets.names.filter((x) => x !== value) });
  const addSize = (scope, value) => {
    const v = value.trim();
    if (!v) return;
    if (scope === "General") {
      if (presets.generalSizes.some((x) => x.toLowerCase() === v.toLowerCase())) return showToast("Already on the list", "danger");
      savePresets({ ...presets, generalSizes: [...presets.generalSizes, v] });
    } else {
      const existing = presets.sizesByCategory[scope] || [];
      if (existing.some((x) => x.toLowerCase() === v.toLowerCase())) return showToast("Already on the list", "danger");
      savePresets({ ...presets, sizesByCategory: { ...presets.sizesByCategory, [scope]: [...existing, v] } });
    }
  };
  const removeSize = (scope, value) => {
    if (scope === "General") {
      savePresets({ ...presets, generalSizes: presets.generalSizes.filter((x) => x !== value) });
    } else {
      const existing = presets.sizesByCategory[scope] || [];
      savePresets({ ...presets, sizesByCategory: { ...presets.sizesByCategory, [scope]: existing.filter((x) => x !== value) } });
    }
  };

  // ---------- Products ----------
  const upsertProduct = (draft) => {
    if (!draft.name.trim()) return showToast("Give the item a name", "danger");
    if (!draft.category.trim()) return showToast("Give the item a category", "danger");
    if (!draft.size.trim()) return showToast("Give the item a size (or type \"One Size\")", "danger");
    if (draft.id) {
      saveProducts(products.map((p) => (p.id === draft.id ? { ...draft, stock: Number(draft.stock), price: Number(draft.price) } : p)));
      showToast("Item updated");
      logAction("Item edited", `${draft.name} (${draft.category}, ${draft.size})`);
    } else {
      saveProducts([...products, { ...draft, id: uid(), stock: Number(draft.stock) || 0, price: Number(draft.price) || 0, addedBy: currentUser.name }]);
      showToast("Item added to stock");
      logAction("Item added", `${draft.name} (${draft.category}, ${draft.size}) · stock ${draft.stock || 0}`);
    }
    setProductModal(null);
  };
  const deleteProduct = (id) => {
    const target = products.find((p) => p.id === id);
    saveProducts(products.filter((p) => p.id !== id));
    setConfirmDelete(null);
    showToast("Item removed");
    if (target) logAction("Item deleted", `${target.name} (${target.category}, ${target.size})`);
  };
  const adjustStock = (id, delta) => {
    const target = products.find((p) => p.id === id);
    saveProducts(products.map((p) => (p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p)));
    if (target) logAction("Stock adjusted", `${target.name} (${target.size}) ${delta > 0 ? "+" : ""}${delta} → ${Math.max(0, target.stock + delta)}`);
  };

  // ---------- Orders ----------
  const buildOrder = (customerName, customerContact, items, createdByLabel) => {
    if (!customerName.trim()) return { error: "Add a customer name" };
    if (items.length === 0) return { error: "Add at least one item" };
    const shortages = items.filter((it) => { const live = productMap[it.productId]; return !live || live.stock < it.qty; });
    if (shortages.length) return { error: `Not enough stock for ${shortages.map((s) => s.name).join(", ")}` };
    const total = items.reduce((s, it) => s + it.qty * it.price, 0);
    const order = { id: uid(), orderNo: "ORD-" + Date.now().toString().slice(-6), customerName: customerName.trim(), customerContact: customerContact.trim(), items, total, status: "unpaid", createdAt: now(), createdBy: createdByLabel, paidAt: null, paidBy: null, delivery: null };
    return { order };
  };

  const createOrder = (customerName, customerContact, items) => {
    const { order, error } = buildOrder(customerName, customerContact, items, currentUser.name);
    if (error) { showToast(error, "danger"); return false; }
    saveOrders([order, ...orders]);
    showToast("Order created — stock reserved once paid");
    logAction("Order created", `${order.orderNo} · ${order.customerName} · ${money(order.total)}`);
    return true;
  };

  const submitPublicOrder = (customerName, customerContact, items) => {
    if (!customerContact.trim()) return { error: "Add an email or phone number so the club can reach you" };
    const { order, error } = buildOrder(customerName, customerContact, items, "Customer (online form)");
    if (error) return { error };
    saveOrders([order, ...orders]);
    logAction("Order created (customer form)", `${order.orderNo} · ${order.customerName} · ${money(order.total)}`);
    return { order };
  };

  const cancelOrder = (orderId) => {
    const prevOrders = orders;
    const target = orders.find((o) => o.id === orderId);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "cancelled" } : o)));
    showToast("Order cancelled", "ok", () => { saveOrders(prevOrders); showToast("Cancellation undone"); });
    if (target) logAction("Order cancelled", `${target.orderNo} · ${target.customerName}`);
  };

  const markPaid = (orderId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const shortages = order.items.filter((it) => { const live = productMap[it.productId]; return !live || live.stock < it.qty; });
    if (shortages.length) { showToast(`Can't confirm payment — short on ${shortages.map((s) => s.name).join(", ")}`, "danger"); return; }
    const prevProducts = products;
    const prevOrders = orders;
    const nextProducts = products.map((p) => { const line = order.items.find((it) => it.productId === p.id); return line ? { ...p, stock: p.stock - line.qty } : p; });
    saveProducts(nextProducts);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "paid", paidAt: now(), paidBy: currentUser.name, delivery: { completed: false, completedAt: null, completedBy: null } } : o)));
    showToast("Payment confirmed — stock updated", "ok", () => { saveProducts(prevProducts); saveOrders(prevOrders); showToast("Payment undone"); });
    logAction("Order marked paid", `${order.orderNo} · ${order.customerName} · ${money(order.total)}`);
  };

  const restockAndVoid = (orderId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const prevProducts = products;
    const prevOrders = orders;
    const nextProducts = products.map((p) => { const line = order.items.find((it) => it.productId === p.id); return line ? { ...p, stock: p.stock + line.qty } : p; });
    saveProducts(nextProducts);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "refunded" } : o)));
    showToast("Order refunded, stock restored", "ok", () => { saveProducts(prevProducts); saveOrders(prevOrders); showToast("Refund undone"); });
    logAction("Order refunded", `${order.orderNo} · ${order.customerName} · ${money(order.total)}`);
  };

  const deleteOrderRecord = (orderId) => {
    const prevOrders = orders;
    const target = orders.find((o) => o.id === orderId);
    saveOrders(orders.filter((o) => o.id !== orderId));
    showToast("Order deleted", "ok", () => { saveOrders(prevOrders); showToast("Deletion undone"); });
    if (target) logAction("Order deleted", `${target.orderNo} · ${target.customerName} · ${money(target.total)} (was ${target.status})`);
  };

  const markDeliveryCompleted = (orderId) => {
    const prevOrders = orders;
    const target = orders.find((o) => o.id === orderId);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, delivery: { completed: true, completedAt: now(), completedBy: currentUser.name } } : o)));
    showToast("Marked as delivered", "ok", () => { saveOrders(prevOrders); showToast("Undone"); });
    if (target) logAction("Delivery completed", `${target.orderNo} · ${target.customerName}`);
  };
  const unmarkDeliveryCompleted = (orderId) => {
    const target = orders.find((o) => o.id === orderId);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, delivery: { completed: false, completedAt: null, completedBy: null } } : o)));
    if (target) logAction("Delivery undone", `${target.orderNo} · ${target.customerName}`);
  };

  if (!ready) return (<div className="app-shell center-loading"><div className="spinner" /></div>);

  if (connError) {
    return (
      <div className="app-shell center-loading">
        <div className="login-card" style={{ textAlign: "left" }}>
          <h2>Can't reach the backend</h2>
          <p className="sub">Check that API_URL in index.html points at your deployed Apps Script /exec URL, that the deployment access is set to "Anyone", and that your token (if set) matches.</p>
        </div>
      </div>
    );
  }

  if (publicOrderMode) {
    return (<div className="app-shell"><PublicOrderForm products={products} onSubmit={submitPublicOrder} onTrack={() => { setPublicOrderMode(false); setPortalMode(true); }} /></div>);
  }

  if (portalMode) {
    return (<div className="app-shell"><CustomerPortal orders={orders} onBack={() => setPortalMode(false)} /></div>);
  }

  if (!currentUser) {
    return (<div className="app-shell"><LoginScreen users={users} onCreateAccount={createAccount} onLogin={attemptLogin} onTrackOrder={() => setPortalMode(true)} onPlaceOrder={() => setPublicOrderMode(true)} /></div>);
  }

  return (
    <div className="app-shell">
      <div className="mobile-topbar">
        <button className="hamburger-btn" onClick={() => setNavOpen(true)}><Menu size={20} /></button>
        <span className="brand-title" style={{ fontSize: 14 }}>Rotorua Pickleball</span>
      </div>
      {navOpen && <div className="sidebar-backdrop" onClick={closeNav} />}

      <aside className={`sidebar ${navOpen ? "open" : ""}`}>
        <div className="brand">
          <span className="brand-mark">RP</span>
          <div><div className="brand-title">Rotorua Pickleball</div><div className="brand-sub">Club gear stock &amp; order desk</div></div>
          <button className="icon-btn sidebar-close" onClick={closeNav}><X size={18} /></button>
        </div>
        <nav className="nav">
          <NavItem icon={<Package size={18} />} label="Stock" active={tab === "stock"} onClick={() => { setTab("stock"); closeNav(); }} count={products.length} />
          <NavItem icon={<ShoppingCart size={18} />} label="Orders" active={tab === "orders"} onClick={() => { setTab("orders"); closeNav(); }} count={orders.filter((o) => o.status === "unpaid").length} countLabel="open" />
          <NavItem icon={<Truck size={18} />} label="Deliveries" active={tab === "deliveries"} onClick={() => { setTab("deliveries"); closeNav(); }} count={orders.filter((o) => o.status === "paid" && !o.delivery?.completed).length} countLabel="pending" />
          <NavItem icon={<UsersIcon size={18} />} label="Team" active={tab === "team"} onClick={() => { setTab("team"); closeNav(); }} count={0} />
          <NavItem icon={<SettingsIcon size={18} />} label="Settings" active={tab === "settings"} onClick={() => { setTab("settings"); closeNav(); }} count={0} />
          {isSuperAdmin && <NavItem icon={<ClipboardList size={18} />} label="Audit Log" active={tab === "audit"} onClick={() => { setTab("audit"); closeNav(); }} count={0} />}
        </nav>
        <div className="user-card">
          <div className="avatar">{initials(currentUser.name)}</div>
          <div className="user-card-info"><div className="user-card-name">{currentUser.name}</div><div className="user-card-role">{roleLabel(currentUser.role)}</div></div>
          <button className="icon-btn" onClick={logout} title="Log out"><LogOut size={16} /></button>
        </div>
      </aside>

      <main className="main">
        {tab === "stock" && <StockView products={products} isAdmin={isAdmin} presets={presets} onAdd={() => setProductModal({ id: null, name: "", category: "", size: "", price: "", stock: "" })} onEdit={(p) => setProductModal(p)} onAdjust={adjustStock} onDelete={(p) => setConfirmDelete(p)} />}
        {tab === "orders" && <OrdersView orders={orders} productMap={productMap} isAdmin={isAdmin} isSuperAdmin={isSuperAdmin} onNew={() => setOrderModal(true)} onPay={markPaid} onCancel={cancelOrder} onRefund={restockAndVoid} onDelete={(o) => setConfirmDeleteOrder(o)} />}
        {tab === "deliveries" && <DeliveriesView orders={orders} onComplete={markDeliveryCompleted} onUndo={unmarkDeliveryCompleted} />}
        {tab === "team" && <TeamView users={users} currentUser={currentUser} isSuperAdmin={isSuperAdmin} onRoleChange={updateUserRole} onRemove={removeUser} onAddTeammate={addTeammate} />}
        {tab === "settings" && <SettingsView presets={presets} isAdmin={isAdmin} onAddCategory={addCategory} onRemoveCategory={removeCategory} onAddName={addName} onRemoveName={removeName} onAddSize={addSize} onRemoveSize={removeSize} />}
        {tab === "audit" && isSuperAdmin && <AuditLogView log={auditLog} />}
      </main>

      {productModal && <ProductModal draft={productModal} presets={presets} products={products} onClose={() => setProductModal(null)} onSave={upsertProduct} />}
      {orderModal && <OrderModal products={products} onClose={() => setOrderModal(false)} onCreate={(name, contact, items) => { if (createOrder(name, contact, items)) setOrderModal(false); }} />}
      {confirmDelete && <ConfirmModal title={`Remove "${confirmDelete.name}"?`} body="This deletes the item from stock. Past orders keep their own record of it." onCancel={() => setConfirmDelete(null)} onConfirm={() => deleteProduct(confirmDelete.id)} />}
      {confirmDeleteOrder && <ConfirmModal title={`Delete order ${confirmDeleteOrder.orderNo}?`} body="This permanently removes the order and its delivery record. This can't be undone once you navigate away from the confirmation." onCancel={() => setConfirmDeleteOrder(null)} onConfirm={() => { deleteOrderRecord(confirmDeleteOrder.id); setConfirmDeleteOrder(null); }} />}
      {toast && (
        <div className={`toast toast-${toast.kind}`}>
          <span>{toast.text}</span>
          {toast.undo && <button className="toast-undo" onClick={() => { toast.undo(); setToast(null); }}>Undo</button>}
        </div>
      )}
    </div>
  );
}

function NavItem({ icon, label, active, onClick, count, countLabel }) {

    <button className={`nav-item ${active ? "active" : ""}`} onClick={onClick}>
      <span className="nav-icon">{icon}</span><span className="nav-label">{label}</span>

// ---------------- Public order form (no login) ----------------
function PublicOrderForm({ products, onSubmit, onTrack }) {
  const [customerName, setCustomerName] = useState("");
  const [customerContact, setCustomerContact] = useState("");
  const [productId, setProductId] = useState("");
  const [qty, setQty] = useState(1);
  const [cart, setCart] = useState([]);
  const [error, setError] = useState("");
  const [confirmed, setConfirmed] = useState(null);

  const available = products.filter((p) => p.stock > 0);
  const grouped = available.reduce((acc, p) => { (acc[p.category] = acc[p.category] || []).push(p); return acc; }, {});
  const selected = products.find((p) => p.id === productId);
  const total = cart.reduce((s, c) => s + c.qty * c.price, 0);

  const addToCart = () => {
    if (!selected) return setError("Pick an item first");
    const inCart = cart.filter((c) => c.productId === selected.id).reduce((s, c) => s + c.qty, 0);
    if (inCart + Number(qty) > selected.stock) return setError(`Only ${selected.stock - inCart} left of ${selected.name}`);
    if (Number(qty) <= 0) return setError("Quantity must be at least 1");
    setError("");
    setCart((c) => [...c, { productId: selected.id, name: selected.name, size: selected.size, price: selected.price, qty: Number(qty) }]);
    setQty(1);
  };
  const removeItem = (i) => setCart((c) => c.filter((_, idx) => idx !== i));

  const submit = () => {
    const result = onSubmit(customerName, customerContact, cart);
    if (result.error) { setError(result.error); return; }
    setConfirmed(result.order);
  };

  if (confirmed) {
    return (
      <div className="login-wrap"><div className="login-card" style={{ width: 380 }}>
        <div className="avatar lg" style={{ background: "var(--ok-bg)", color: "var(--ok)" }}><Check size={22} /></div>
        <h2>Order received!</h2>
        <p className="sub">Thanks, {confirmed.customerName}. Save this number to track your order or arrange payment with the club:</p>
        <div className="order-no" style={{ justifyContent: "center", fontSize: 18 }}>{confirmed.orderNo}</div>
        <p className="sub">Total due: <strong style={{ color: "var(--text)" }}>{money(confirmed.total)}</strong></p>
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 6 }} onClick={onTrack}>Track this order</button>
      </div></div>
    );
  }

  return (
    <div className="login-wrap"><div className="login-card" style={{ width: 420, textAlign: "left" }}>
      <span className="brand-mark lg" style={{ alignSelf: "center" }}>RP</span>
      <h2 style={{ textAlign: "center" }}>Order club gear</h2>
      <p className="sub" style={{ textAlign: "center" }}>Fill this in and the club will confirm payment with you directly.</p>

      <label>Your name<input value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Jamie Lee" /></label>
      <label>Email or phone<input value={customerContact} onChange={(e) => setCustomerContact(e.target.value)} placeholder="so we can reach you" /></label>

      <div className="divider" />

      <div className="field-row">
        <label>Item
          <select value={productId} onChange={(e) => setProductId(e.target.value)}>
            <option value="">Choose an item...</option>
            {Object.entries(grouped).map(([cat, items]) => (
              <optgroup key={cat} label={cat}>
                {items.map((p) => <option key={p.id} value={p.id}>{p.name} ({p.size}) — {money(p.price)}</option>)}
              </optgroup>
            ))}
          </select>
        </label>
        <label>Qty<input type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} /></label>
      </div>
      <button className="btn btn-ghost" onClick={addToCart}><Plus size={14} /> Add to order</button>
      {error && <div className="form-error"><AlertTriangle size={14} /> {error}</div>}

      {cart.length > 0 && (
        <div className="cart">
          {cart.map((c, i) => (<div key={i} className="cart-row"><span>{c.qty}× {c.name} ({c.size})</span><span className="cart-row-right">{money(c.qty * c.price)} <button className="icon-btn sm" onClick={() => removeItem(i)}><Trash2 size={14} /></button></span></div>))}
          <div className="cart-total">Total <strong>{money(total)}</strong></div>
        </div>
      )}

      <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={submit}>Submit order</button>
      <button className="link-btn" style={{ alignSelf: "center", marginTop: 4 }} onClick={onTrack}>Already ordered? Track it</button>
    </div></div>
  );
}

// ---------------- Customer portal ----------------
function CustomerPortal({ orders, onBack }) {
  const [query, setQuery] = useState("");
  const [result, setResult] = useState(undefined);

  const lookup = () => {
    const clean = query.trim().toUpperCase().replace(/^ORD-?/, "");
    const found = orders.find((o) => o.orderNo.toUpperCase().replace("ORD-", "") === clean || o.orderNo.toUpperCase() === query.trim().toUpperCase());
    setResult(found || null);
  };

  return (
    <div className="login-wrap">
      <div className="login-card" style={{ width: 380 }}>
        <span className="brand-mark lg">RP</span>
        <h2>Track your order</h2>
        <p className="sub">Enter the order number from your receipt (e.g. ORD-123456)</p>
        <div style={{ display: "flex", gap: 8 }}>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ORD-123456" onKeyDown={(e) => e.key === "Enter" && lookup()} style={{ flex: 1 }} />
          <button className="btn btn-primary" onClick={lookup}><Search size={14} /></button>
        </div>

        {result === null && <div className="form-error" style={{ marginTop: 4 }}><AlertTriangle size={14} /> No order found with that number.</div>}

        {result && (
          <div className="order-card" style={{ textAlign: "left", marginTop: 4 }}>
            <div className="order-card-top">
              <div><div className="order-no">{result.orderNo} <span className={`pill status-${result.status}`}>{result.status}</span></div><div className="stock-meta">{result.customerName}</div></div>
              <div className="order-total">{money(result.total)}</div>
            </div>
            <div className="order-items">{result.items.map((it, i) => (<div key={i} className="order-item-row"><span>{it.qty}× {it.name} ({it.size})</span><span>{money(it.qty * it.price)}</span></div>))}</div>
            {result.status === "paid" && (
              <div style={{ marginTop: 10 }}>
                <div className="hint"><Truck size={14} /> {result.delivery?.completed ? `Delivered ${fmtDate(result.delivery.completedAt)}` : "Not yet delivered"}</div>
              </div>
            )}
            {result.status === "unpaid" && <p className="sub" style={{ marginTop: 10 }}>This order is awaiting payment before it's processed.</p>}
            {(result.status === "cancelled" || result.status === "refunded") && <p className="sub" style={{ marginTop: 10 }}>This order was {result.status}.</p>}
          </div>
        )}

        <button className="link-btn" style={{ marginTop: 14 }} onClick={onBack}>Back to staff login</button>
      </div>
    </div>
  );
}

function LoginScreen({ users, onCreateAccount, onLogin, onTrackOrder, onPlaceOrder }) {
  const [mode, setMode] = useState(users.length === 0 ? "create" : "pick");
  const [pickedUser, setPickedUser] = useState(null);
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");

  if (mode === "pin" && pickedUser) {
    return (
      <div className="login-wrap"><div className="login-card">
        <div className="avatar lg">{initials(pickedUser.name)}</div>
        <h2>{pickedUser.name}</h2><p className="sub">Enter your PIN to continue</p>
        <input type="password" inputMode="numeric" maxLength={8} placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} autoFocus />
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 10 }} onClick={() => onLogin(pickedUser, pin)}><Lock size={14} /> Unlock</button>
        <button className="link-btn" style={{ marginTop: 12 }} onClick={() => { setMode("pick"); setPin(""); setPickedUser(null); }}>Back</button>
      </div></div>
    );
  }
  if (mode === "create" && users.length === 0) {
    return (
      <div className="login-wrap"><div className="login-card">
        <span className="brand-mark lg">RP</span>
        <h2>Set up Rotorua Pickleball Club Gear</h2>
        <p className="sub">Create the first account — it becomes the Super Admin. After this, only a Super Admin can create further accounts, from the Team tab.</p>
        <label>Name<input value={name} onChange={(e) => setName(e.target.value)} placeholder="Jamie Lee" autoFocus /></label>
        <label>PIN (optional)<input type="password" inputMode="numeric" maxLength={8} value={pin} onChange={(e) => setPin(e.target.value)} placeholder="Leave blank for none" /></label>
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 6 }} onClick={() => onCreateAccount(name, "superadmin", pin)}>Create account</button>
        <p className="disclaimer"><AlertTriangle size={12} /> Named accounts for accountability, not secure login — don't reuse a real password as the PIN.</p>
      </div></div>
    );
  }
  return (
    <div className="login-wrap"><div className="login-card">
      <span className="brand-mark lg">RP</span><h2>Who's this?</h2><p className="sub">Pick your name to open the shared board</p>
      <div className="user-pick-list">
        {users.map((u) => (
          <button key={u.id} className="user-pick" onClick={() => (u.pin ? (setPickedUser(u), setMode("pin")) : onLogin(u, ""))}>
            <div className="avatar">{initials(u.name)}</div>
            <div className="user-pick-info"><div className="user-card-name">{u.name}</div><div className="user-card-role">{roleLabel(u.role)}</div></div>
            {u.pin && <Lock size={14} className="lock-icon" />}
          </button>
        ))}
      </div>
      <button className="link-btn" style={{ marginTop: 14 }} onClick={onPlaceOrder}>Customer? Place an order</button>
      <button className="link-btn" style={{ marginTop: 6 }} onClick={onTrackOrder}>Customer? Track your order</button>
      <p className="disclaimer"><AlertTriangle size={12} /> Named accounts for accountability, not secure login.</p>
    </div></div>
  );
}

        <select value={scope} onChange={(e) => setScope(e.target.value)}>

          {presets.categories.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </label>
      <div className="chip-row">
        {values.length === 0 && <span className="stock-meta">Nothing added yet — falls back to General</span>}

      </div>
      {isAdmin && (
        <div style={{ display: "flex", gap: 8, marginTop: 10, maxWidth: 340 }}>
          <input value={val} onChange={(e) => setVal(e.target.value)} placeholder="e.g. 3XL" onKeyDown={(e) => { if (e.key === "Enter") { onAddSize(scope, val); setVal(""); } }} />
          <button className="btn btn-ghost btn-sm" onClick={() => { onAddSize(scope, val); setVal(""); }}><Plus size={14} /> Add</button>
        </div>
      )}
    </div>
  );
}

// ---------------- Audit Log ----------------
function AuditLogView({ log }) {
  const [q, setQ] = useState("");
  const filtered = log.filter((e) => (e.actor + e.action + e.details).toLowerCase().includes(q.toLowerCase()));
  return (
    <div>
      <div className="view-header"><div><h1>Audit Log</h1><p className="sub">A running record of who did what — visible only to Super Admins. Keeps the most recent {AUDIT_LOG_DISPLAY_CAP_NOTE}.</p></div></div>
      <div className="search-row"><Search size={16} className="search-icon" /><input placeholder="Search by person, action, or detail" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      {filtered.length === 0 ? (
        <EmptyState icon={<ClipboardList size={28} />} title="Nothing logged yet" body="Actions across Stock, Orders, Deliveries, and Team will show up here as they happen." />
      ) : (
        <div className="table-scroll">
          <table className="stock-table">
            <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead>
            <tbody>

const KNOWN_SIZE_ORDER = ["XXS", "XS", "S", "M", "L", "XL", "XXL", "2XL", "XXXL", "3XL", "4XL", "One Size"];
function sizeRank(size) {
  const idx = KNOWN_SIZE_ORDER.findIndex((s) => s.toLowerCase() === (size || "").toLowerCase());
  return idx === -1 ? Infinity : idx;
}
function compareSize(a, b) {
  const ra = sizeRank(a), rb = sizeRank(b);
  if (ra !== rb) return ra - rb;
  return (a || "").localeCompare(b || "");
}
function sortProducts(list, sortBy) {
  const arr = [...list];
  arr.sort((a, b) => {
    if (sortBy === "name-desc") return b.name.localeCompare(a.name);
    if (sortBy === "size-asc") return compareSize(a.size, b.size);
    if (sortBy === "size-desc") return compareSize(b.size, a.size);
    return a.name.localeCompare(b.name); // name-asc, default
  });
  return arr;
}

function OrderModal({ products, onClose, onCreate }) {
  const [customerName, setCustomerName] = useState("");
  const [customerContact, setCustomerContact] = useState("");
  const [productId, setProductId] = useState(products[0]?.id || "");
  const [qty, setQty] = useState(1);
  const [cart, setCart] = useState([]);
  const [error, setError] = useState("");
  const available = products.filter((p) => p.stock > 0);
  const selected = products.find((p) => p.id === productId);
  const groupedAvailable = available.reduce((acc, p) => { (acc[p.category] = acc[p.category] || []).push(p); return acc; }, {});
  const addToCart = () => {
    if (!selected) return setError("Pick an item first");
    const inCart = cart.filter((c) => c.productId === selected.id).reduce((s, c) => s + c.qty, 0);
    if (inCart + Number(qty) > selected.stock) return setError(`Only ${selected.stock - inCart} left of ${selected.name}`);
    if (Number(qty) <= 0) return setError("Quantity must be at least 1");
    setError("");
    setCart((c) => [...c, { productId: selected.id, name: selected.name, size: selected.size, price: selected.price, qty: Number(qty) }]);
    setQty(1);
  };
  const removeItem = (i) => setCart((c) => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, c) => s + c.qty * c.price, 0);
  return (
    <div className="overlay" onClick={onClose}><div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
      <div className="modal-head"><h2>New order</h2><button className="icon-btn" onClick={onClose}><X size={18} /></button></div>
      <div className="modal-body">
        <div className="field-row"><label>Customer name<input value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Jamie Lee" autoFocus /></label><label>Contact (optional)<input value={customerContact} onChange={(e) => setCustomerContact(e.target.value)} placeholder="email or phone" /></label></div>
        <div className="divider" />
        <div className="field-row">
          <label>Item
            <select value={productId} onChange={(e) => setProductId(e.target.value)}>
              {available.length === 0 && <option value="">No stock available</option>}
              {Object.entries(groupedAvailable).map(([cat, items]) => (
                <optgroup key={cat} label={cat}>
                  {items.map((p) => <option key={p.id} value={p.id}>{p.name} ({p.size}) — {p.stock} left</option>)}
                </optgroup>
              ))}
            </select>
          </label>
          <label>Qty<input type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} /></label>
          <button className="btn btn-ghost" style={{ alignSelf: "flex-end" }} onClick={addToCart}>Add</button>
        </div>
        {error && <div className="form-error"><AlertTriangle size={14} /> {error}</div>}
        {cart.length > 0 && (<div className="cart">{cart.map((c, i) => (<div key={i} className="cart-row"><span>{c.qty}× {c.name} ({c.size})</span><span className="cart-row-right">{money(c.qty * c.price)} <button className="icon-btn sm" onClick={() => removeItem(i)}><Trash2 size={14} /></button></span></div>))}<div className="cart-total">Total <strong>{money(total)}</strong></div></div>)}
      </div>
      <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={() => onCreate(customerName, customerContact, cart)}>Create order</button></div>
    </div></div>
  );
}
