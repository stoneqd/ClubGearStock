<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Gear Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  html, body { margin: 0; padding: 0; background: #0A0C10; }
  #root { min-height: 100vh; display: flex; align-items: stretch; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ============ CONFIGURE THIS ============ */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";
const API_TOKEN = ""; // only needed if you set a TOKEN script property in Apps Script
/* ========================================= */

const storage = {
  async get(key) {
    const url = `${API_URL}?key=${encodeURIComponent(key)}${API_TOKEN ? `&token=${encodeURIComponent(API_TOKEN)}` : ""}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data || data.value === undefined || data.value === null) return null;
    return { key, value: JSON.stringify(data.value) };
  },
  async set(key, value) {
    const url = `${API_URL}${API_TOKEN ? `?token=${encodeURIComponent(API_TOKEN)}` : ""}`;
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key, value: JSON.parse(value) }),
    });
    return { key, value };
  },
};

const uid = () => Math.random().toString(36).slice(2, 10);
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
const now = () => new Date().toISOString();
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");
const initials = (name) => (name || "?").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();

const LOW_STOCK = 5;
const SIZES = ["XS", "S", "M", "L", "XL", "XXL", "One Size"];
const DELIVERY_STEPS = ["processing", "shipped", "delivered"];
const DELIVERY_LABEL = { processing: "Processing", shipped: "Shipped", delivered: "Delivered" };

function stockTone(qty) {
  if (qty <= 0) return { label: "Out of stock", cls: "tone-danger" };
  if (qty <= LOW_STOCK) return { label: "Low stock", cls: "tone-warn" };
  return { label: "In stock", cls: "tone-ok" };
}

/* ---------- minimal inline icon set (no external icon package needed) ---------- */
const Icon = ({ children, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const Package = (p) => <Icon {...p}><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></Icon>;
const ShoppingCart = (p) => <Icon {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></Icon>;
const Truck = (p) => <Icon {...p}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M12 2 1 21h22L12 2z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-6.36L1 10"/></Icon>;
const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
const UsersIcon = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;

function App() {
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [users, setUsers] = useState([]);
  const [currentUser, setCurrentUser] = useState(null);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("stock");
  const [toast, setToast] = useState(null);
  const [connError, setConnError] = useState(false);

  const [productModal, setProductModal] = useState(null);
  const [orderModal, setOrderModal] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const p = await storage.get("club-gear-products");
        const o = await storage.get("club-gear-orders");
        const u = await storage.get("club-gear-users");
        setProducts(p ? JSON.parse(p.value) : []);
        setOrders(o ? JSON.parse(o.value) : []);
        setUsers(u ? JSON.parse(u.value) : []);
        const sessionId = localStorage.getItem("clubgear-session");
        if (sessionId) {
          const loaded = u ? JSON.parse(u.value) : [];
          const match = loaded.find((usr) => usr.id === sessionId);
          if (match) setCurrentUser(match);
        }
      } catch (e) {
        console.error("Load failed", e);
        setConnError(true);
      }
      setReady(true);
    })();
  }, []);

  const saveProducts = async (next) => {
    setProducts(next);
    try { await storage.set("club-gear-products", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const saveOrders = async (next) => {
    setOrders(next);
    try { await storage.set("club-gear-orders", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };
  const saveUsers = async (next) => {
    setUsers(next);
    try { await storage.set("club-gear-users", JSON.stringify(next)); }
    catch (e) { console.error(e); showToast("Couldn't save — check your connection", "danger"); }
  };

  const showToast = (text, kind = "ok") => {
    setToast({ text, kind, id: uid() });
    setTimeout(() => setToast((t) => (t && t.text === text ? null : t)), 3200);
  };

  const productMap = useMemo(() => Object.fromEntries(products.map((p) => [p.id, p])), [products]);
  const isAdmin = currentUser?.role === "admin";

  const loginAs = (user) => { setCurrentUser(user); localStorage.setItem("clubgear-session", user.id); };
  const createAccount = async (name, role, pin) => {
    const trimmed = name.trim();
    if (!trimmed) return showToast("Enter a name", "danger");
    if (users.some((u) => u.name.toLowerCase() === trimmed.toLowerCase())) return showToast("That name's already taken", "danger");
    const account = { id: uid(), name: trimmed, role, pin: pin ? pin.trim() : "", createdAt: now() };
    await saveUsers([...users, account]);
    loginAs(account);
    showToast(`Welcome, ${trimmed}`);
  };
  const attemptLogin = (user, pinInput) => {
    if (user.pin && user.pin !== pinInput.trim()) return showToast("Wrong PIN", "danger");
    loginAs(user);
    showToast(`Welcome back, ${user.name}`);
  };
  const logout = () => { setCurrentUser(null); localStorage.removeItem("clubgear-session"); };
  const updateUserRole = (id, role) => {
    const admins = users.filter((u) => u.role === "admin");
    if (role === "staff" && admins.length === 1 && admins[0].id === id) return showToast("Need at least one admin", "danger");
    saveUsers(users.map((u) => (u.id === id ? { ...u, role } : u)));
    if (currentUser?.id === id) setCurrentUser((c) => ({ ...c, role }));
  };
  const removeUser = (id) => {
    const admins = users.filter((u) => u.role === "admin");
    if (admins.length === 1 && admins[0].id === id) return showToast("Need at least one admin", "danger");
    saveUsers(users.filter((u) => u.id !== id));
    if (currentUser?.id === id) logout();
    showToast("Teammate removed");
  };

  const upsertProduct = (draft) => {
    if (!draft.name.trim()) return showToast("Give the item a name", "danger");
    if (draft.id) {
      saveProducts(products.map((p) => (p.id === draft.id ? { ...draft, stock: Number(draft.stock), price: Number(draft.price) } : p)));
      showToast("Item updated");
    } else {
      saveProducts([...products, { ...draft, id: uid(), stock: Number(draft.stock) || 0, price: Number(draft.price) || 0, addedBy: currentUser.name }]);
      showToast("Item added to stock");
    }
    setProductModal(null);
  };
  const deleteProduct = (id) => { saveProducts(products.filter((p) => p.id !== id)); setConfirmDelete(null); showToast("Item removed"); };
  const adjustStock = (id, delta) => { saveProducts(products.map((p) => (p.id === id ? { ...p, stock: Math.max(0, p.stock + delta) } : p))); };

  const createOrder = (customerName, customerContact, items) => {
    if (!customerName.trim()) return showToast("Add a customer name", "danger");
    if (items.length === 0) return showToast("Add at least one item", "danger");
    const shortages = items.filter((it) => { const live = productMap[it.productId]; return !live || live.stock < it.qty; });
    if (shortages.length) { showToast(`Not enough stock for ${shortages.map((s) => s.name).join(", ")}`, "danger"); return false; }
    const total = items.reduce((s, it) => s + it.qty * it.price, 0);
    const order = { id: uid(), orderNo: "ORD-" + Date.now().toString().slice(-6), customerName: customerName.trim(), customerContact: customerContact.trim(), items, total, status: "unpaid", createdAt: now(), createdBy: currentUser.name, paidAt: null, paidBy: null, delivery: null };
    saveOrders([order, ...orders]);
    showToast("Order created — stock reserved once paid");
    return true;
  };
  const cancelOrder = (orderId) => { saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "cancelled" } : o))); showToast("Order cancelled"); };
  const markPaid = (orderId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const shortages = order.items.filter((it) => { const live = productMap[it.productId]; return !live || live.stock < it.qty; });
    if (shortages.length) { showToast(`Can't confirm payment — short on ${shortages.map((s) => s.name).join(", ")}`, "danger"); return; }
    const nextProducts = products.map((p) => { const line = order.items.find((it) => it.productId === p.id); return line ? { ...p, stock: p.stock - line.qty } : p; });
    saveProducts(nextProducts);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "paid", paidAt: now(), paidBy: currentUser.name, delivery: { status: "processing", trackingNumber: "", courier: "", address: "", updatedBy: currentUser.name } } : o)));
    showToast("Payment confirmed — stock updated");
  };
  const restockAndVoid = (orderId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const nextProducts = products.map((p) => { const line = order.items.find((it) => it.productId === p.id); return line ? { ...p, stock: p.stock + line.qty } : p; });
    saveProducts(nextProducts);
    saveOrders(orders.map((o) => (o.id === orderId ? { ...o, status: "refunded" } : o)));
    showToast("Order refunded, stock restored");
  };
  const updateDelivery = (orderId, patch) => {
    saveOrders(orders.map((o) => {
      if (o.id !== orderId) return o;
      const delivery = { ...o.delivery, ...patch, updatedBy: currentUser.name };
      if (patch.status === "shipped" && !delivery.shippedAt) delivery.shippedAt = now();
      if (patch.status === "delivered" && !delivery.deliveredAt) delivery.deliveredAt = now();
      return { ...o, delivery };
    }));
  };

  if (!ready) return (<div className="app-shell center-loading"><div className="spinner" /></div>);

  if (connError) {
    return (
      <div className="app-shell center-loading">
        <div className="login-card" style={{ textAlign: "left" }}>
          <h2>Can't reach the backend</h2>
          <p className="sub">Check that API_URL in index.html points at your deployed Apps Script /exec URL, that the deployment access is set to "Anyone", and that your token (if set) matches.</p>
        </div>
      </div>
    );
  }

  if (!currentUser) {
    return (<div className="app-shell"><LoginScreen users={users} onCreateAccount={createAccount} onLogin={attemptLogin} /></div>);
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="brand">
          <span className="brand-mark">CG</span>
          <div><div className="brand-title">Club Gear</div><div className="brand-sub">Stock &amp; order desk</div></div>
        </div>
        <nav className="nav">
          <NavItem icon={<Package size={18} />} label="Stock" active={tab === "stock"} onClick={() => setTab("stock")} count={products.length} />
          <NavItem icon={<ShoppingCart size={18} />} label="Orders" active={tab === "orders"} onClick={() => setTab("orders")} count={orders.filter((o) => o.status === "unpaid").length} countLabel="open" />
          <NavItem icon={<Truck size={18} />} label="Deliveries" active={tab === "deliveries"} onClick={() => setTab("deliveries")} count={orders.filter((o) => o.status === "paid" && o.delivery?.status !== "delivered").length} countLabel="pending" />
          <NavItem icon={<UsersIcon size={18} />} label="Team" active={tab === "team"} onClick={() => setTab("team")} count={0} />
        </nav>
        <div className="user-card">
          <div className="avatar">{initials(currentUser.name)}</div>
          <div className="user-card-info"><div className="user-card-name">{currentUser.name}</div><div className="user-card-role">{currentUser.role === "admin" ? "Admin" : "Staff"}</div></div>
          <button className="icon-btn" onClick={logout} title="Log out"><LogOut size={16} /></button>
        </div>
      </aside>

      <main className="main">
        {tab === "stock" && <StockView products={products} isAdmin={isAdmin} onAdd={() => setProductModal({ id: null, name: "", category: "T-Shirt", size: "M", price: "", stock: "" })} onEdit={(p) => setProductModal(p)} onAdjust={adjustStock} onDelete={(p) => setConfirmDelete(p)} />}
        {tab === "orders" && <OrdersView orders={orders} productMap={productMap} onNew={() => setOrderModal(true)} onPay={markPaid} onCancel={cancelOrder} onRefund={restockAndVoid} />}
        {tab === "deliveries" && <DeliveriesView orders={orders} onUpdate={updateDelivery} />}
        {tab === "team" && <TeamView users={users} currentUser={currentUser} isAdmin={isAdmin} onRoleChange={updateUserRole} onRemove={removeUser} />}
      </main>

      {productModal && <ProductModal draft={productModal} onClose={() => setProductModal(null)} onSave={upsertProduct} />}
      {orderModal && <OrderModal products={products} onClose={() => setOrderModal(false)} onCreate={(name, contact, items) => { if (createOrder(name, contact, items)) setOrderModal(false); }} />}
      {confirmDelete && <ConfirmModal title={`Remove "${confirmDelete.name}"?`} body="This deletes the item from stock. Past orders keep their own record of it." onCancel={() => setConfirmDelete(null)} onConfirm={() => deleteProduct(confirmDelete.id)} />}
      {toast && <div className={`toast toast-${toast.kind}`}>{toast.text}</div>}
    </div>
  );
}

function NavItem({ icon, label, active, onClick, count, countLabel }) {
  return (
    <button className={`nav-item ${active ? "active" : ""}`} onClick={onClick}>
      <span className="nav-icon">{icon}</span><span className="nav-label">{label}</span>
      {count > 0 && <span className="nav-count">{count}{countLabel ? ` ${countLabel}` : ""}</span>}
    </button>
  );
}

function LoginScreen({ users, onCreateAccount, onLogin }) {
  const [mode, setMode] = useState(users.length === 0 ? "create" : "pick");
  const [pickedUser, setPickedUser] = useState(null);
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [role, setRole] = useState("staff");

  if (mode === "pin" && pickedUser) {
    return (
      <div className="login-wrap"><div className="login-card">
        <div className="avatar lg">{initials(pickedUser.name)}</div>
        <h2>{pickedUser.name}</h2><p className="sub">Enter your PIN to continue</p>
        <input type="password" inputMode="numeric" maxLength={8} placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} autoFocus />
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 10 }} onClick={() => onLogin(pickedUser, pin)}><Lock size={14} /> Unlock</button>
        <button className="link-btn" style={{ marginTop: 12 }} onClick={() => { setMode("pick"); setPin(""); setPickedUser(null); }}>Back</button>
      </div></div>
    );
  }
  if (mode === "create") {
    return (
      <div className="login-wrap"><div className="login-card">
        <span className="brand-mark lg">CG</span>
        <h2>{users.length === 0 ? "Set up Club Gear" : "New teammate"}</h2>
        <p className="sub">{users.length === 0 ? "Create the first account — it becomes the admin." : "Add a name so orders and deliveries can be tracked back to whoever handled them."}</p>
        <label>Name<input value={name} onChange={(e) => setName(e.target.value)} placeholder="Jamie Lee" autoFocus /></label>
        <label>PIN (optional)<input type="password" inputMode="numeric" maxLength={8} value={pin} onChange={(e) => setPin(e.target.value)} placeholder="Leave blank for none" /></label>
        {users.length > 0 && (<label>Role<select value={role} onChange={(e) => setRole(e.target.value)}><option value="staff">Staff</option><option value="admin">Admin</option></select></label>)}
        <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center", marginTop: 6 }} onClick={() => onCreateAccount(name, users.length === 0 ? "admin" : role, pin)}>Create account</button>
        {users.length > 0 && <button className="link-btn" style={{ marginTop: 12 }} onClick={() => setMode("pick")}>Back to team list</button>}
        <p className="disclaimer"><AlertTriangle size={12} /> Named accounts for accountability, not secure login — don't reuse a real password as the PIN.</p>
      </div></div>
    );
  }
  return (
    <div className="login-wrap"><div className="login-card">
      <span className="brand-mark lg">CG</span><h2>Who's this?</h2><p className="sub">Pick your name to open the shared board</p>
      <div className="user-pick-list">
        {users.map((u) => (
          <button key={u.id} className="user-pick" onClick={() => (u.pin ? (setPickedUser(u), setMode("pin")) : onLogin(u, ""))}>
            <div className="avatar">{initials(u.name)}</div>
            <div className="user-pick-info"><div className="user-card-name">{u.name}</div><div className="user-card-role">{u.role === "admin" ? "Admin" : "Staff"}</div></div>
            {u.pin && <Lock size={14} className="lock-icon" />}
          </button>
        ))}
      </div>
      <button className="btn btn-ghost" style={{ width: "100%", justifyContent: "center", marginTop: 4 }} onClick={() => setMode("create")}><Plus size={14} /> Add teammate</button>
      <p className="disclaimer"><AlertTriangle size={12} /> Named accounts for accountability, not secure login.</p>
    </div></div>
  );
}

function TeamView({ users, currentUser, isAdmin, onRoleChange, onRemove }) {
  return (
    <div>
      <div className="view-header"><div><h1>Team</h1><p className="sub">{users.length} account{users.length === 1 ? "" : "s"} on this board</p></div></div>
      {!isAdmin && <p className="sub" style={{ marginBottom: 14 }}>Only admins can change roles or remove teammates.</p>}
      <div className="order-list">
        {users.map((u) => (
          <div key={u.id} className="order-card team-row">
            <div className="avatar">{initials(u.name)}</div>
            <div style={{ flex: 1 }}><div className="user-card-name">{u.name}{u.id === currentUser.id ? " (you)" : ""}</div><div className="stock-meta">{u.pin ? "PIN protected" : "No PIN"}</div></div>
            <span className={`pill ${u.role === "admin" ? "status-paid" : "status-unpaid"}`}>{u.role === "admin" ? "Admin" : "Staff"}</span>
            {isAdmin && (<div className="order-card-actions" style={{ marginTop: 0 }}>
              <button className="link-btn" onClick={() => onRoleChange(u.id, u.role === "admin" ? "staff" : "admin")}>{u.role === "admin" ? "Make staff" : "Make admin"}</button>
              <button className="link-btn danger" onClick={() => onRemove(u.id)}>Remove</button>
            </div>)}
          </div>
        ))}
      </div>
    </div>
  );
}

function StockView({ products, isAdmin, onAdd, onEdit, onAdjust, onDelete }) {
  const [q, setQ] = useState("");
  const filtered = products.filter((p) => (p.name + p.category + p.size).toLowerCase().includes(q.toLowerCase()));
  const grouped = filtered.reduce((acc, p) => { (acc[p.category] = acc[p.category] || []).push(p); return acc; }, {});
  return (
    <div>
      <div className="view-header"><div><h1>Stock</h1><p className="sub">{products.length} item{products.length === 1 ? "" : "s"} across all categories</p></div><button className="btn btn-primary" onClick={onAdd}><Plus size={16} /> Add item</button></div>
      <div className="search-row"><Search size={16} className="search-icon" /><input placeholder="Search by name, category, or size" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      {products.length === 0 ? (
        <EmptyState icon={<Package size={28} />} title="No gear yet" body="Add your first item — t-shirt, hoodie, cap, whatever the club sells." action={<button className="btn btn-primary" onClick={onAdd}><Plus size={16} /> Add item</button>} />
      ) : (
        Object.entries(grouped).map(([cat, items]) => (
          <div key={cat} className="group">
            <div className="group-title">{cat}</div>
            <div className="card-grid">
              {items.map((p) => {
                const tone = stockTone(p.stock);
                return (
                  <div key={p.id} className="stock-card">
                    <div className="stock-card-top"><div><div className="stock-name">{p.name}</div><div className="stock-meta">Size {p.size} · {money(p.price)}</div></div><span className={`pill ${tone.cls}`}>{tone.label}</span></div>
                    <div className="stock-count-row"><button className="qty-btn" onClick={() => onAdjust(p.id, -1)} disabled={p.stock <= 0}>−</button><div className="stock-count">{p.stock}</div><button className="qty-btn" onClick={() => onAdjust(p.id, 1)}>+</button><span className="stock-count-label">in stock</span></div>

        <div className="field-row"><label>Price<input type="number" min="0" step="0.01" value={form.price} onChange={(e) => set("price", e.target.value)} placeholder="25.00" /></label><label>Stock on hand<input type="number" min="0" step="1" value={form.stock} onChange={(e) => set("stock", e.target.value)} placeholder="0" /></label></div>

function OrdersView({ orders, productMap, onNew, onPay, onCancel, onRefund }) {

      <div className="view-header"><div><h1>Orders</h1><p className="sub">{orders.length} order{orders.length === 1 ? "" : "s"} total</p></div><button className="btn btn-primary" onClick={onNew}><Plus size={16} /> New order</button></div>
      <div className="tab-row">{["all", "unpaid", "paid", "cancelled", "refunded"].map((f) => (<button key={f} className={`tab-chip ${filter === f ? "active" : ""}`} onClick={() => setFilter(f)}>{f[0].toUpperCase() + f.slice(1)}</button>))}</div>
      {visible.length === 0 ? (
        <EmptyState icon={<ShoppingCart size={28} />} title="No orders here" body="Orders you create will show up in this list." action={<button className="btn btn-primary" onClick={onNew}><Plus size={16} /> New order</button>} />
      ) : (
        <div className="order-list">
          {visible.map((o) => (
            <div key={o.id} className="order-card">
              <div className="order-card-top"><div><div className="order-no">{o.orderNo} <span className={`pill status-${o.status}`}>{o.status}</span></div><div className="stock-meta">{o.customerName}{o.customerContact ? ` · ${o.customerContact}` : ""} · {fmtDate(o.createdAt)}{o.createdBy ? ` · by ${o.createdBy}` : ""}</div></div><div className="order-total">{money(o.total)}</div></div>
              <div className="order-items">{o.items.map((it, i) => (<div key={i} className="order-item-row"><span>{it.qty}× {it.name} ({it.size})</span><span>{money(it.qty * it.price)}</span></div>))}</div>
              <div className="order-card-actions">
                {o.status === "unpaid" && (<><button className="btn btn-primary btn-sm" onClick={() => onPay(o.id)}><Check size={14} /> Mark paid</button><button className="btn btn-ghost btn-sm" onClick={() => onCancel(o.id)}>Cancel order</button></>)}
                {o.status === "paid" && (<><span className="hint"><Truck size={14} /> Delivery: {DELIVERY_LABEL[o.delivery?.status] || "Processing"}{o.paidBy ? ` · paid by ${o.paidBy}` : ""}</span>{o.delivery?.status !== "delivered" && (<button className="btn btn-ghost btn-sm" onClick={() => onRefund(o.id)}><RotateCcw size={14} /> Refund &amp; restock</button>)}</>)}
              </div>
            </div>
          ))}

function OrderModal({ products, onClose, onCreate }) {
  const [customerName, setCustomerName] = useState("");
  const [customerContact, setCustomerContact] = useState("");
  const [productId, setProductId] = useState(products[0]?.id || "");
  const [qty, setQty] = useState(1);
  const [cart, setCart] = useState([]);
  const [error, setError] = useState("");
  const available = products.filter((p) => p.stock > 0);
  const selected = products.find((p) => p.id === productId);
  const addToCart = () => {
    if (!selected) return setError("Pick an item first");
    const inCart = cart.filter((c) => c.productId === selected.id).reduce((s, c) => s + c.qty, 0);
    if (inCart + Number(qty) > selected.stock) return setError(`Only ${selected.stock - inCart} left of ${selected.name}`);
    if (Number(qty) <= 0) return setError("Quantity must be at least 1");
    setError("");
    setCart((c) => [...c, { productId: selected.id, name: selected.name, size: selected.size, price: selected.price, qty: Number(qty) }]);
    setQty(1);
  };
  const removeItem = (i) => setCart((c) => c.filter((_, idx) => idx !== i));
  const total = cart.reduce((s, c) => s + c.qty * c.price, 0);
  return (
    <div className="overlay" onClick={onClose}><div className="modal modal-lg" onClick={(e) => e.stopPropagation()}>
      <div className="modal-head"><h2>New order</h2><button className="icon-btn" onClick={onClose}><X size={18} /></button></div>
      <div className="modal-body">
        <div className="field-row"><label>Customer name<input value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Jamie Lee" autoFocus /></label><label>Contact (optional)<input value={customerContact} onChange={(e) => setCustomerContact(e.target.value)} placeholder="email or phone" /></label></div>
        <div className="divider" />
        <div className="field-row"><label>Item<select value={productId} onChange={(e) => setProductId(e.target.value)}>{available.length === 0 && <option value="">No stock available</option>}{available.map((p) => <option key={p.id} value={p.id}>{p.name} ({p.size}) — {p.stock} left</option>)}</select></label><label>Qty<input type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} /></label><button className="btn btn-ghost" style={{ alignSelf: "flex-end" }} onClick={addToCart}>Add</button></div>
        {error && <div className="form-error"><AlertTriangle size={14} /> {error}</div>}
        {cart.length > 0 && (<div className="cart">{cart.map((c, i) => (<div key={i} className="cart-row"><span>{c.qty}× {c.name} ({c.size})</span><span className="cart-row-right">{money(c.qty * c.price)} <button className="icon-btn sm" onClick={() => removeItem(i)}><Trash2 size={14} /></button></span></div>))}<div className="cart-total">Total <strong>{money(total)}</strong></div></div>)}
      </div>
      <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={() => onCreate(customerName, customerContact, cart)}>Create order</button></div>
    </div></div>
  );
}

function DeliveriesView({ orders, onUpdate }) {
  const [filter, setFilter] = useState("pending");
  const paidOrders = orders.filter((o) => o.status === "paid");
  const visible = paidOrders.filter((o) => { if (filter === "all") return true; if (filter === "pending") return o.delivery?.status !== "delivered"; return o.delivery?.status === filter; });
  return (
    <div>
      <div className="view-header"><div><h1>Deliveries</h1><p className="sub">Track every paid order until it reaches the customer</p></div></div>
      <div className="tab-row">{["pending", "processing", "shipped", "delivered", "all"].map((f) => (<button key={f} className={`tab-chip ${filter === f ? "active" : ""}`} onClick={() => setFilter(f)}>{f[0].toUpperCase() + f.slice(1)}</button>))}</div>
      {visible.length === 0 ? (
        <EmptyState icon={<Truck size={28} />} title="Nothing to deliver" body="Paid orders will appear here so you can move them through processing, shipped, and delivered." />
      ) : (
        <div className="order-list">
          {visible.map((o) => {
            const d = o.delivery || { status: "processing" };
            const stepIndex = DELIVERY_STEPS.indexOf(d.status);
            return (
              <div key={o.id} className="order-card">
                <div className="order-card-top"><div><div className="order-no">{o.orderNo}</div><div className="stock-meta">{o.customerName}{o.customerContact ? ` · ${o.customerContact}` : ""} · Paid {fmtDate(o.paidAt)}</div></div><span className={`pill delivery-${d.status}`}>{DELIVERY_LABEL[d.status]}</span></div>
                <div className="progress-track">{DELIVERY_STEPS.map((s, i) => (<div key={s} className={`progress-step ${i <= stepIndex ? "done" : ""}`}><div className="progress-dot" /><span>{DELIVERY_LABEL[s]}</span></div>))}</div>
                <div className="field-row"><label>Address<input value={d.address || ""} onChange={(e) => onUpdate(o.id, { address: e.target.value })} placeholder="Delivery address" /></label><label>Tracking #<input value={d.trackingNumber || ""} onChange={(e) => onUpdate(o.id, { trackingNumber: e.target.value })} placeholder="Optional" /></label><label>Courier<input value={d.courier || ""} onChange={(e) => onUpdate(o.id, { courier: e.target.value })} placeholder="Optional" /></label></div>
                <div className="order-card-actions">
                  {d.status === "processing" && <button className="btn btn-primary btn-sm" onClick={() => onUpdate(o.id, { status: "shipped" })}><Truck size={14} /> Mark shipped</button>}
                  {d.status === "shipped" && <button className="btn btn-primary btn-sm" onClick={() => onUpdate(o.id, { status: "delivered" })}><Check size={14} /> Mark delivered</button>}
                  {d.status === "delivered" && <span className="hint"><Check size={14} /> Delivered {fmtDate(d.deliveredAt)}{d.updatedBy ? ` · by ${d.updatedBy}` : ""}</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EmptyState({ icon, title, body, action }) {
  return (<div className="empty-state"><div className="empty-icon">{icon}</div><div className="empty-title">{title}</div><div className="empty-body">{body}</div>{action}</div>);
}
